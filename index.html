<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soczó-Rajmund</title>
    <link rel="stylesheet" href="stilus.css">
    <script type="module" src="mukodes.js"></script>
</head>

<body>
    <header>
        <h1>Számplógép</h1>
    </header>

    <article>
        <input type="text" id="kijelzo">

        <div id="numpad">
            <button id="7" class="szamok">7</button>

            <button id="8" class="szamok">8</button>

            <button id="9" class="szamok">9</button>

            <button id="osztas" class="muvelet">/</button>

            <button id="4" class="szamok">4</button>
 
            <button id="5" class="szamok">5</button>
 
            <button id="6" class="szamok">6</button>
  
            <button id="szorzas" class="muvelet">*</button>

            <button id="1" class="szamok">1</button>

            <button id="2" class="szamok">2</button>

            <button id="3" class="szamok">3</button>

            <button id="kivonas" class="muvelet">-</button>

            <button id="torles">C</button>

            <button id="0" class="szamok">0</button>

            <button id="egyeno">=</button>

            <button id="osszeadas" class="muvelet">+</button>
        </div>


    </article>

</body>
</html>
